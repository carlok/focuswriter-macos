name: Build macOS DMG

# Tag vX.Y.Z-macN (e.g. v1.9.1-mac1) to build upstream tag vX.Y.Z as package
# revision N and create a DRAFT release. Nothing is published until a human
# clicks "Publish release". Manual runs build and keep the DMG as a workflow
# artifact only.
on:
  push:
    tags: ['v*-mac*']
  workflow_dispatch:

permissions:
  contents: write        # create the draft release
  id-token: write        # sign the provenance attestation (Sigstore)
  attestations: write    # store the attestation on GitHub

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26    # Apple Silicon runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read config and check tag
        id: cfg
        run: |
          source config.env
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "qt_version=$QT_VERSION" >> "$GITHUB_OUTPUT"
          echo "qt_key=qt-$QT_VERSION-${QT_MODULES// /-}-aqt$AQT_VERSION" >> "$GITHUB_OUTPUT"
          revision=
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            if [ "${tag%-mac*}" != "$UPSTREAM_TAG" ]; then
              echo "::error::Tag $tag does not match UPSTREAM_TAG=$UPSTREAM_TAG in config.env"
              exit 1
            fi
            revision=${tag##*-mac}
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Cache Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/qt
          key: ${{ steps.cfg.outputs.qt_key }}

      - name: Install Rosetta (for the x86_64 smoke test)
        run: softwareupdate --install-rosetta --agree-to-license || echo "Rosetta unavailable; x86_64 run will be skipped"

      - name: Build
        run: scripts/build.sh

      - name: Deploy Qt into the bundle
        run: scripts/deploy.sh

      - name: Ad-hoc sign
        run: scripts/sign.sh work/stage/FocusWriter.app

      - name: Smoke test
        env:
          QTDIR: ${{ github.workspace }}/work/qt/${{ steps.cfg.outputs.qt_version }}/macos
          SMOKE_SECONDS: '15'
        run: scripts/smoke.sh work/stage/FocusWriter.app

      - name: Create DMG and checksums
        run: scripts/dmg.sh "${{ steps.cfg.outputs.revision }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

      - name: Keep DMG as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/
          if-no-files-found: error

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPSTREAM_TAG: ${{ steps.cfg.outputs.upstream_tag }}
          QT_VERSION: ${{ steps.cfg.outputs.qt_version }}
        run: |
          dmg=$(cd dist && ls *.dmg)
          {
            echo "Unofficial macOS build of [FocusWriter $UPSTREAM_TAG](https://github.com/gottcode/focuswriter/releases/tag/$UPSTREAM_TAG), built from the unmodified upstream source."
            echo
            echo "- Universal (Apple Silicon + Intel), macOS $(defaults read "$PWD/work/stage/FocusWriter.app/Contents/Info.plist" LSMinimumSystemVersion) or later"
            echo "- Upstream commit: \`$(cat work/upstream-commit.txt)\`"
            echo "- Qt $QT_VERSION (official binaries)"
            echo "- Ad-hoc signed, **not notarized**: see [Install](https://github.com/$GITHUB_REPOSITORY#install) for the one-time Gatekeeper step."
            echo
            echo "Verify:"
            echo '```'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify $dmg --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS)\`"
          } > notes.md
          gh release create "$TAG" dist/*.dmg dist/SHA256SUMS \
            --draft --verify-tag \
            --title "FocusWriter ${UPSTREAM_TAG#v} for macOS (r${TAG##*-mac})" \
            --notes-file notes.md
